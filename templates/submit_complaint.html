<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Issue | SII&RS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Submit Student Issue</h1>

    <form method="POST">

        <label>Issue Title</label>

        <input
            type="text"
            name="title"
            placeholder="Example: Wi-Fi not working in Hostel B"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            rows="6"
            placeholder="Describe your issue..."
            required
        ></textarea>

        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Example: Hostel B"
        >

        <label>Category</label>

        <select name="category_id" required>

            <option value="">
                Select Category
            </option>

            {% for category in categories %}

            <option value="{{ category.id }}">
                {{ category.name }}
            </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Submit Issue
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
